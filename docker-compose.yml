# Full application: MySQL, RabbitMQ, backend and frontend.
# The frontend is built from its GitHub repository; to build a local copy instead:
#   FRONTEND_PATH=../iasbank-front docker compose up --build -d
services:
  mysql:
    image: mysql:8.0
    container_name: ias_bank_mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ias_bank
    volumes:
      - ias_bank_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ias_bank_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: .
    container_name: ias_bank_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RABBITMQ_HOST: rabbitmq
      TZ: America/Bogota
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ${FRONTEND_PATH:-https://github.com/JEdwardGs17/iasbank-front.git#master}
    container_name: ias_bank_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  ias_bank_data:
